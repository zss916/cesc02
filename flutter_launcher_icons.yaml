# Terminal => flutter pub run flutter_launcher_icons -f flutter_launcher_icons.yaml

flutter_launcher_icons:
  # Android 默认启动器图标。
  android: true

  # iOS AppIcon 图标集。
  ios: true

  # 图标源图。建议使用 1024×1024 的正方形 PNG。
  image_path: "assets/launch/logo.png"

  # iOS 图标源图，包含透明安全边距。
  image_path_ios: "assets/launch/logo.png"

  # Android 最低 SDK 版本。
  min_sdk_android: 21

  # iOS 图标不保留 Alpha 通道；透明像素填充为白色。
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"






