flutter_native_splash:

  #一张图作为splash
  #background_image: assets/splash/splash.png
  #background_image_dark: assets/splash/splash.png


  #底图纯色作为splash
  color_dark: "#FFFFFF"
  fullscreen: true
  image_dark: assets/launch/logo.png
