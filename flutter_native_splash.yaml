    color_dark: "#FFFFFF"# 背景色（深色模式）
    image: assets/launch/splash_logo_android12.png # 中心图标
    icon_background_color: "#FFFFFF"
    image_dark: assets/launch/splash_logo_android12.png # 中心图标（深色模式）



    #image_dark: assets/appname.png
    #icon_background_color_dark: "#FFED00"
    #image: assets/logo-development.png
    #icon_background_color: "#ffffff"
    #image_dark: assets/logo-development.png
    #icon_background_color_dark: "#121212"

  android: true
  web: false
  ios: true